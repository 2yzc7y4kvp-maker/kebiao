name: class-push

# 已停用：GitHub 的 cron 在这个仓库上几小时才触发一次，抓不住 10~25 分钟的窗口。
# 现在改用 Cloudflare Worker 的 cron（每分钟，准）。
# 这里保留成只能手动触发，需要排查时可以点一下跑一次，不会再自动跑、不会重复推送。
on:
  workflow_dispatch:

permissions:
  contents: write

# 不取消旧的：新旧重叠时宁可多跑一个，也别制造空档。
concurrency:
  group: class-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 长跑检查
        env:
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
          RUN_MINUTES: '340'
        run: node scripts/tick.mjs

      - name: 记录已推送
        if: always()
        run: |
          git config user.name "class-push-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/sent.json
          if git diff --staged --quiet; then
            echo "没有新推送"
            exit 0
          fi
          git commit -m "chore: 记录已推送的课 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break || sleep 5
          done
